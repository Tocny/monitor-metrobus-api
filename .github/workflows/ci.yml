name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: metrobus
          POSTGRES_PASSWORD: metrobus
          POSTGRES_DB: metrobus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Correr tests
        env:
          DATABASE_TEST_URL: postgresql://metrobus:metrobus@localhost:5432/metrobus_test
          DATABASE_URL: postgresql://metrobus:metrobus@localhost:5432/metrobus_test
          METROBUS_API_LOGIN_URL: http://mock-no-usado-en-tests
          METROBUS_API_USUARIO: test
          METROBUS_API_SENHA: test
          POSTGRES_USER: metrobus
          POSTGRES_PASSWORD: metrobus
          POSTGRES_DB: metrobus_test
        run: pytest --tb=short -q